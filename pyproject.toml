[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engecad"
version = "0.1.0"
description = "CAD livre para mapeamento e plantas cadastrais"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.7",
    "ezdxf>=1.3",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.gui-scripts]
engecad = "engecad.app:main"

[tool.setuptools.packages.find]
include = ["engecad*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
